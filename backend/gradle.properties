# ============================================================
# rental-crm backend — Gradle 프로젝트 설정
# 시스템 JAVA_HOME 은 17 그대로 두고, 본 프로젝트만 Java 21 사용.
# ============================================================

# Gradle Toolchain 이 Java 21 을 찾을 경로 (사용자별 환경)
# 시스템 JAVA_HOME 을 덮어쓰지 않음 — IntelliJ / gradlew 가 본 경로의 21 만 사용.
# 콤마로 여러 경로 지정 가능. 백슬래시는 슬래시로 (Gradle 권장).
org.gradle.java.installations.paths=C:/WORK/JDK/openjdk-21+35_windows-x64_bin

# Toolchain 자동 다운로드 비활성화 — 명시 경로만 사용
org.gradle.java.installations.auto-download=false

# Toolchain 자동 검출 — JDK 폴더 자동 찾기. true 면 시스템의 JAVA_HOME(17) 도 후보로 들어가나
# build.gradle 의 JavaLanguageVersion.of(21) 명시로 17 은 자동 제외됨.
org.gradle.java.installations.auto-detect=true

# ============================================================
# 성능 최적화
# ============================================================
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
