<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('기사 관리')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">기사/방문</div>
                        <h2 class="page-title">기사 관리</h2>
                        <p class="text-secondary mt-1">행 더블클릭 = 수정. 지역별 가용 기사는 검색 (지역 + 사용=Y).</p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="EngineerForm.openCreate()">
                                <i class="ti ti-plus"></i> 기사 등록
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return EngineerList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">기사코드</label>
                                <input type="text" name="engineerCode" class="form-control" placeholder="ENG-00001">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">기사명</label>
                                <input type="text" name="engineerName" class="form-control" placeholder="홍길동">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">유형</label>
                                <select name="engineerType" class="form-select">
                                    <option value="">전체</option>
                                    <option value="INTERNAL">내부 직원</option>
                                    <option value="EXTERNAL">외주</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">지역</label>
                                <input type="text" name="area" class="form-control" placeholder="서울 강남구">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">사용여부</label>
                                <select name="useYn" class="form-select">
                                    <option value="">전체</option>
                                    <option value="Y" selected>사용</option>
                                    <option value="N">미사용</option>
                                </select>
                            </div>
                            <div class="col-md-9 d-flex justify-content-end align-items-end gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="EngineerList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card card-grid">
                    <div class="card-body">
                        <div id="engineerGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal modal-blur fade" id="engineerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="engineerModalTitle">기사 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="engineerForm">
                    <input type="hidden" name="engineerId">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label required">기사코드</label>
                            <input type="text" name="engineerCode" class="form-control" required maxlength="20" placeholder="ENG-00001">
                            <small class="form-hint">UNIQUE — 다른 기사와 중복 불가</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">기사명</label>
                            <input type="text" name="engineerName" class="form-control" required maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">유형</label>
                            <select name="engineerType" class="form-select" required>
                                <option value="">— 선택 —</option>
                                <option value="INTERNAL">내부 직원</option>
                                <option value="EXTERNAL">외주</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">연락처</label>
                            <input type="tel" name="phone" class="form-control" required maxlength="20" placeholder="01012345678">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">이메일</label>
                            <input type="email" name="email" class="form-control" maxlength="254">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">담당 지역</label>
                            <input type="text" name="area" class="form-control" maxlength="100" placeholder="서울 강남구">
                        </div>
                        <div class="col-md-3 d-none" id="useYnRow">
                            <label class="form-label">사용여부</label>
                            <select name="useYn" class="form-select">
                                <option value="Y" selected>사용</option>
                                <option value="N">미사용</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="EngineerForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/engineer-list.js}"></script>
<script th:src="@{/js/engineer-form.js}"></script>
</body>
</html>
