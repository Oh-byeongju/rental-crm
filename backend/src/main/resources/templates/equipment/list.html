<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('장비 관리')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">장비/상품</div>
                        <h2 class="page-title">장비 관리</h2>
                        <p class="text-secondary mt-1">행 더블클릭 = 수정. 단종 장비는 사용여부 N 으로 비활성화.</p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="EquipmentForm.openCreate()">
                                <i class="ti ti-plus"></i> 장비 등록
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return EquipmentList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">장비코드</label>
                                <input type="text" name="equipmentCode" class="form-control" placeholder="EQ-AC-0001">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">유형</label>
                                <select name="equipmentType" id="searchEquipmentType" class="form-select">
                                    <option value="">전체</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">모델명</label>
                                <input type="text" name="modelName" class="form-control" placeholder="모델명">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">제조사</label>
                                <input type="text" name="manufacturer" class="form-control" placeholder="제조사">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">사용여부</label>
                                <select name="useYn" class="form-select">
                                    <option value="">전체</option>
                                    <option value="Y" selected>사용</option>
                                    <option value="N">단종</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">재고</label>
                                <select name="stockFilter" class="form-select">
                                    <option value="AVAILABLE" selected>재고 있음</option>
                                    <option value="">전체</option>
                                    <option value="OUT_OF_STOCK">재고 없음</option>
                                </select>
                            </div>
                            <div class="col-md-6 d-flex justify-content-end align-items-end gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="EquipmentList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card card-grid">
                    <div class="card-body">
                        <div id="equipmentGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal modal-blur fade" id="equipmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="equipmentModalTitle">장비 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="equipmentForm">
                    <input type="hidden" name="equipmentId">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label required">장비코드</label>
                            <input type="text" name="equipmentCode" class="form-control" required maxlength="20" placeholder="EQ-AC-0001">
                            <small class="form-hint">UNIQUE — 다른 장비와 중복 불가</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">유형</label>
                            <select name="equipmentType" id="formEquipmentType" class="form-select" required>
                                <option value="">— 선택 —</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">모델명</label>
                            <input type="text" name="modelName" class="form-control" required maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">제조사</label>
                            <input type="text" name="manufacturer" class="form-control" required maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">출시일</label>
                            <input type="date" name="releaseDate" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">이미지 URL</label>
                            <input type="url" name="imageUrl" class="form-control" maxlength="500" placeholder="https://...">
                        </div>
                        <div class="col-12">
                            <label class="form-label">설명</label>
                            <textarea name="description" class="form-control" rows="3" maxlength="1000"></textarea>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required">재고</label>
                            <input type="number" name="stockQty" class="form-control" min="0" required value="0">
                            <small class="form-hint">총 보유 수량</small>
                        </div>
                        <div class="col-md-3 d-none" id="useYnRow">
                            <label class="form-label">사용여부</label>
                            <select name="useYn" class="form-select">
                                <option value="Y" selected>사용</option>
                                <option value="N">단종</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="EquipmentForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/equipment-list.js}"></script>
<script th:src="@{/js/equipment-form.js}"></script>
</body>
</html>
