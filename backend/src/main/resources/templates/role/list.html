<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('역할 관리')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <!-- 페이지 헤더 -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">시스템관리</div>
                        <h2 class="page-title">역할 관리</h2>
                        <p class="text-secondary mt-1">권한(AUTH 키)은 행 안의 "권한 부여" 링크로 진입.</p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="RoleForm.openCreate()">
                                <i class="ti ti-plus"></i> 역할 등록
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 본문 -->
        <div class="page-body">
            <div class="container-xl">

                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return RoleList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">역할 코드</label>
                                <input type="text" name="roleCode" class="form-control" placeholder="ADMIN">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">역할명</label>
                                <input type="text" name="roleName" class="form-control" placeholder="관리자">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">사용여부</label>
                                <select name="useYn" class="form-select">
                                    <option value="">전체</option>
                                    <option value="Y" selected>사용</option>
                                    <option value="N">미사용</option>
                                </select>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="RoleList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card card-grid">
                    <div class="card-body">
                        <div id="roleGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 역할 등록/수정 모달 -->
<div class="modal modal-blur fade" id="roleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="roleModalTitle">역할 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="roleForm">
                    <input type="hidden" name="roleId">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label required">역할 코드</label>
                            <input type="text" name="roleCode" class="form-control" required maxlength="50"
                                   pattern="^[A-Z][A-Z0-9_]*$" placeholder="OPERATOR">
                            <small class="form-hint">영문 대문자/숫자/언더스코어. 등록 후 변경 불가.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">역할명</label>
                            <input type="text" name="roleName" class="form-control" required maxlength="100">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">설명</label>
                            <textarea name="description" class="form-control" rows="2" maxlength="500"></textarea>
                        </div>
                        <div class="col-md-3" id="useYnRow">
                            <label class="form-label">사용여부</label>
                            <select name="useYn" class="form-select">
                                <option value="Y" selected>사용</option>
                                <option value="N">미사용</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="RoleForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/role-list.js}"></script>
<script th:src="@{/js/role-form.js}"></script>
</body>
</html>
