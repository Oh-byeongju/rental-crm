<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('상품 관리')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">장비/상품</div>
                        <h2 class="page-title">상품 관리</h2>
                        <p class="text-secondary mt-1">행 더블클릭 = 수정. 단종 장비를 가진 상품도 등록 가능 (계약 시점에 차단).</p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="ProductForm.openCreate()">
                                <i class="ti ti-plus"></i> 상품 등록
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return ProductList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">상품코드</label>
                                <input type="text" name="productCode" class="form-control" placeholder="PROD-AC-0001">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">장비</label>
                                <select name="equipmentId" id="searchEquipmentId" class="form-select">
                                    <option value="">전체</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">상품명</label>
                                <input type="text" name="productName" class="form-control" placeholder="상품명">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">사용여부</label>
                                <select name="useYn" class="form-select">
                                    <option value="">전체</option>
                                    <option value="Y" selected>사용</option>
                                    <option value="N">미사용</option>
                                </select>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="ProductList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card card-grid">
                    <div class="card-body">
                        <div id="productGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 등록/수정 모달 -->
<div class="modal modal-blur fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalTitle">상품 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" name="productId">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label required">상품코드</label>
                            <input type="text" name="productCode" class="form-control" required maxlength="20" placeholder="PROD-AC-0001">
                            <small class="form-hint">UNIQUE — 다른 상품과 중복 불가</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">장비</label>
                            <select name="equipmentId" id="formEquipmentId" class="form-select" required>
                                <option value="">— 선택 —</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label required">상품명</label>
                            <input type="text" name="productName" class="form-control" required maxlength="200">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required">월 렌탈료 (원)</label>
                            <input type="number" name="monthlyFee" class="form-control" min="1" required placeholder="50000">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required">계약 개월</label>
                            <input type="number" name="contractMonths" class="form-control" min="1" required value="12">
                            <small class="form-hint">최소 1개월</small>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required">보증금 (원)</label>
                            <input type="number" name="depositAmount" class="form-control" min="0" required value="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label required">설치비 (원)</label>
                            <input type="number" name="installFee" class="form-control" min="0" required value="0">
                        </div>
                        <div class="col-12">
                            <label class="form-label">설명</label>
                            <textarea name="description" class="form-control" rows="3" maxlength="1000"></textarea>
                        </div>
                        <div class="col-md-3 d-none" id="useYnRow">
                            <label class="form-label">사용여부</label>
                            <select name="useYn" class="form-select">
                                <option value="Y" selected>사용</option>
                                <option value="N">미사용</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="ProductForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/product-list.js}"></script>
<script th:src="@{/js/product-form.js}"></script>
</body>
</html>
