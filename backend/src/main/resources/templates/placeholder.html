<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('준비 중')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-body">
            <div class="container-xl">
                <div class="empty">
                    <div class="empty-img">
                        <i class="ti ti-tools" style="font-size: 4rem; color: #6c757d;"></i>
                    </div>
                    <p class="empty-title" th:text="${menuName} ?: '메뉴'">메뉴</p>
                    <p class="empty-subtitle text-muted">
                        이 화면은 아직 구현되지 않았습니다. (Phase 1B/1C 진행 중)
                    </p>
                    <p class="empty-subtitle text-muted">
                        <small>요청 경로: <code th:text="${requestPath}">/sys/codes</code></small>
                    </p>
                    <div class="empty-action">
                        <a href="/" class="btn btn-primary">
                            <i class="ti ti-arrow-left me-1"></i>
                            대시보드로 돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
