<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('로그인')}"></head>
<body class="d-flex flex-column bg-white">
<div class="page page-center">
    <div class="container container-tight py-4">

        <div class="text-center mb-4">
            <a href="/" class="navbar-brand navbar-brand-autodark">
                <i class="ti ti-package me-2"></i>
                <span style="font-size: 1.5rem; font-weight: 600;">rental-crm</span>
            </a>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4">백오피스 로그인</h2>

                <!-- 에러 alert (로그인 실패 시) -->
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <i class="ti ti-alert-circle me-1"></i>
                    <span th:text="${errorMessage}">로그인 실패</span>
                </div>

                <form th:action="@{/login}" method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label">이메일</label>
                        <input type="email" name="email" class="form-control"
                               placeholder="admin@rental.crm" required autofocus>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="비밀번호 입력" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-check">
                            <input type="checkbox" name="rememberMe" class="form-check-input"/>
                            <span class="form-check-label">로그인 유지</span>
                        </label>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            로그인
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center text-muted mt-3">
            <small>본 시스템은 인가된 사용자만 접근 가능합니다.</small>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
