<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('권한 미세 조정')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">
                            <a th:href="@{/admin/users}"><i class="ti ti-arrow-left"></i> 관리자 목록</a>
                        </div>
                        <h2 class="page-title">
                            <span th:text="${user.userName}">관리자</span>
                            <small class="text-secondary" th:text="${user.email}">admin@rental.com</small>
                        </h2>
                        <p class="text-secondary mt-1">
                            역할:
                            <span class="badge bg-blue-lt" th:if="${user.roleName}" th:text="${user.roleName}">관리자</span>
                            <span class="text-secondary" th:unless="${user.roleName}">— 미부여 —</span>
                        </p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" id="btnSave" class="btn btn-primary" onclick="UserAuthMatrix.save()">
                                <i class="ti ti-device-floppy"></i> 저장
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <!-- SUPER_ADMIN 안내 (역할이 SUPER 면 개인 조정 의미 없음) -->
                <div class="alert alert-info mb-3" id="superAdminAlert" style="display:none" role="alert">
                    <div class="d-flex">
                        <div><i class="ti ti-info-circle me-2"></i></div>
                        <div>
                            이 관리자는 <strong>SUPER_ADMIN</strong> 역할이라 모든 권한이 자동 부여됩니다.
                            개인 GRANT/REVOKE 는 권한 판정에 영향이 없습니다 (UI 입력은 가능).
                        </div>
                    </div>
                </div>

                <!-- 필터 -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-2 search-form">
                            <div class="col-md-3">
                                <label class="form-label">메뉴</label>
                                <input type="text" id="filterMenu" class="form-control" placeholder="고객" onkeyup="UserAuthMatrix.applyFilter()">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">권한 유형</label>
                                <select id="filterType" class="form-select" onchange="UserAuthMatrix.applyFilter()">
                                    <option value="">전체</option>
                                    <option value="VIEW">VIEW</option>
                                    <option value="CREATE">CREATE</option>
                                    <option value="UPDATE">UPDATE</option>
                                    <option value="DELETE">DELETE</option>
                                    <option value="EXECUTE">EXECUTE</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">상태</label>
                                <select id="filterState" class="form-select" onchange="UserAuthMatrix.applyFilter()">
                                    <option value="">전체</option>
                                    <option value="effective">최종 부여</option>
                                    <option value="role">역할 권한</option>
                                    <option value="grant">개인 GRANT</option>
                                    <option value="revoke">개인 REVOKE</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 매트릭스 그리드 -->
                <div class="card card-grid">
                    <div class="card-body">
                        <div id="matrixGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 페이지 데이터 -->
<input type="hidden" id="userId"   th:value="${user.userId}">
<input type="hidden" id="roleCode" th:value="${user.roleCode}">

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/user-auth-matrix.js}"></script>
</body>
</html>
