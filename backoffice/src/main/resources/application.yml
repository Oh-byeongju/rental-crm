spring:
  application:
    name: rental-backoffice

  profiles:
    active: local

  # ===== Datasource (Oracle 21c XE) =====
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: rental
    password: rental
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: rental-hikari-pool
      connection-timeout: 30000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate           # 스키마는 init-scripts/oracle/*.sql 이 권위. JPA 는 검증만.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        # bulk INSERT 학습 (Ch.1) — batch size 명시
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
        # JPA N+1 방지 의식 (개발 환경에서만)
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false            # OSIV 끔 (실무 권장)

  # ===== Kafka =====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: rental-crm-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.rental.backoffice.*,com.rental.domain.*
    listener:
      ack-mode: manual_immediate

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ===== Thymeleaf (백오피스) =====
  # 정적 자원 / Thymeleaf 캐시는 profile 별 application-{profile}.yml 에서 override.
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

# ===== Server =====
# Windows + Docker Desktop / WSL2 환경에서 Hyper-V (`hns`) 가 1024 부터 동적 포트를 잡아
# 8080-8679 가 부팅 시 통째로 예약되는 경우가 잦음 (8080, 8081 모두 영향).
# 백오피스는 9091 사용 (예약 범위 밖). SERVER_PORT 환경변수로 override 가능.
server:
  port: ${SERVER_PORT:9091}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

# ===== Actuator (health / metrics) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ===== Springdoc (Swagger) =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# ===== JWT (직접 작성 시) =====
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-256-bits-required-for-hs256-algorithm}
    access-token-ttl: PT30M          # 30분
    refresh-token-ttl: P7D           # 7일

  audit:
    # 9컬럼 자동 주입 시 기본값 (실제 운영 코드에서 SecurityContext 로 덮어씀)
    default-pgm-id: SYSTEM
    default-user-id: SYSTEM

  # ===== batch 모듈 호출 (ADR-014 Step 5) =====
  internal:
    batch:
      base-url: ${BATCH_BASE_URL:http://localhost:9093}
      token: ${BATCH_INTERNAL_TOKEN:dev-secret-change-me}

# ===== Logging =====
logging:
  level:
    root: INFO
    com.rental.backoffice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # bind parameter 출력 (개발용)
