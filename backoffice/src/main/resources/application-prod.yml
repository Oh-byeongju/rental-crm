# ============================================================
# rental-crm — 운영 프로파일
# 활성화: SPRING_PROFILES_ACTIVE=prod
#
# 핵심:
#  - 정적 자원에 콘텐츠 해시 자동 부여 (`/js/app-a1b2c3d4.js`)
#  - 브라우저/CDN 캐시 1년 + immutable
#  - 변경된 파일만 새 해시 → 부분 캐시 무효화
#  - Thymeleaf 캐시 ON
# ============================================================

spring:
  thymeleaf:
    cache: true                    # 템플릿 컴파일 결과 캐시

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        # 1년 캐시 + immutable. 콘텐츠 해시로 변경 추적.
        period: PT8760H            # 365일
        cachecontrol:
          max-age: PT8760H
          cache-public: true
      chain:
        enabled: true
        # 콘텐츠 해시 versioning — 파일 내용 변경 시 새 해시 자동 부여
        strategy:
          content:
            enabled: true
            paths: /**

  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

# 운영 — SQL 로그 최소화
logging:
  level:
    root: INFO
    com.rental.backoffice: INFO
    org.hibernate.SQL: WARN
