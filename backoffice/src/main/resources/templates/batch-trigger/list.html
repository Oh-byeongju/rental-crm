<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('배치 실행')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">청구/수납</div>
                        <h2 class="page-title">배치 실행</h2>
                        <p class="text-secondary mt-1">
                            ADR-014 Step 5 — backoffice → batch REST 통신 검증용 더미 시나리오.
                            실 시나리오는 Step 7 (Ch.1 청구 배치) 부터 추가됨.
                        </p>
                    </div>
                    <div class="col-auto">
                        <a href="/admin/batches" class="btn btn-default">
                            <i class="ti ti-list-details me-1"></i> 실행 이력 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards">

                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="card-title">
                                    <i class="ti ti-circle-check text-success me-1"></i>
                                    DUMMY_SUCCESS
                                </h3>
                                <p class="text-secondary">
                                    500ms 대기 후 정상 종료. <code>BL_BATCH_LOG</code> 에
                                    <span class="badge bg-success-lt">COMPLETED</span> 한 줄 기록.
                                </p>
                                <button type="button"
                                        class="btn btn-success w-100"
                                        onclick="BatchTrigger.run('DUMMY_SUCCESS')">
                                    <i class="ti ti-player-play me-1"></i> 실행
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="card-title">
                                    <i class="ti ti-alert-triangle text-danger me-1"></i>
                                    DUMMY_FAIL
                                </h3>
                                <p class="text-secondary">
                                    200ms 대기 후 강제 실패. <code>BL_BATCH_LOG</code> 에
                                    <span class="badge bg-danger-lt">FAILED</span> + ERROR_MSG 기록.
                                </p>
                                <button type="button"
                                        class="btn btn-danger w-100"
                                        onclick="BatchTrigger.run('DUMMY_FAIL')">
                                    <i class="ti ti-player-play me-1"></i> 실행
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/batch-trigger.js}"></script>
</body>
</html>
