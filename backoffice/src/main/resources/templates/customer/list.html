<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('고객 관리')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <!-- 페이지 헤더 -->
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">회원 (B2C)</div>
                        <h2 class="page-title">고객 관리</h2>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="CustomerForm.openCreate()">
                                <i class="ti ti-plus"></i> 등록
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 본문 -->
        <div class="page-body">
            <div class="container-xl">

                <!-- 검색 카드 -->
                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return CustomerList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">고객명</label>
                                <input type="text" name="name" class="form-control" placeholder="이름 prefix">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">연락처</label>
                                <input type="text" name="phone" class="form-control" placeholder="01012345678">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">이메일</label>
                                <input type="text" name="email" class="form-control" placeholder="hong@example.com">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">사용여부</label>
                                <select name="useYn" class="form-select">
                                    <option value="">전체</option>
                                    <option value="Y" selected>사용</option>
                                    <option value="N">미사용</option>
                                </select>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="CustomerList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 그리드 카드 -->
                <div class="card card-grid">
                    <div class="card-body">
                        <div id="customerGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ===== 등록/수정 모달 ===== -->
<div class="modal modal-blur fade" id="customerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="customerModalTitle">고객 등록</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <input type="hidden" name="customerId">
                    <div class="row g-2">
                        <div class="col-md-12 d-none" id="customerNoRow">
                            <label class="form-label">고객번호</label>
                            <input type="text" name="customerNo" class="form-control" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">고객명</label>
                            <input type="text" name="customerName" class="form-control" required maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">연락처</label>
                            <input type="tel" name="phone" class="form-control" required pattern="^[0-9]{10,11}$" placeholder="01012345678">
                        </div>
                        <div class="col-md-6" id="emailRow">
                            <label class="form-label required">이메일</label>
                            <input type="email" name="email" class="form-control" required maxlength="254">
                        </div>
                        <div class="col-md-6" id="passwordRow">
                            <label class="form-label required">비밀번호</label>
                            <input type="password" name="password" class="form-control" minlength="8" maxlength="64">
                            <small class="form-hint">8자 이상</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">생년월일</label>
                            <input type="date" name="birthDate" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">우편번호</label>
                            <input type="text" name="addressZip" class="form-control" maxlength="10">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">약관 동의</label>
                            <div class="form-check pt-2">
                                <input type="checkbox" name="termsAgreeYn" class="form-check-input" value="Y">
                                <label class="form-check-label">동의함</label>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">사용여부</label>
                            <select name="useYn" class="form-select">
                                <option value="Y" selected>사용</option>
                                <option value="N">미사용</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label required">주소</label>
                            <input type="text" name="address" class="form-control" required maxlength="500">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">비고</label>
                            <input type="text" name="wrkRmk" class="form-control" maxlength="100">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" id="btnSave" onclick="CustomerForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/customer-list.js}"></script>
<script th:src="@{/js/customer-form.js}"></script>
</body>
</html>
