<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="navbar navbar-vertical navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark">
            <a href="/" class="text-decoration-none">
                <i class="ti ti-package me-2"></i>
                rental-crm
            </a>
        </h1>

        <div class="collapse navbar-collapse" id="sidebar-menu">
            <ul class="navbar-nav pt-lg-3">

                <!-- 동적 메뉴 — SidebarMenuInterceptor 가 model.sidebarMenus 주입 (ADR-008) -->
                <li th:each="menu : ${sidebarMenus}"
                    th:class="${menu.menuType == 'GROUP'} ? 'nav-item dropdown' : 'nav-item'">

                    <!-- LEAF (단독 또는 자식 없는 단독 LEAF) -->
                    <a th:if="${menu.menuType == 'LEAF'}"
                       class="nav-link"
                       th:classappend="${menu.menuUrl == currentPath} ? ' active' : ''"
                       th:href="${menu.menuUrl}">
                        <span class="nav-link-icon" th:if="${menu.iconClass}">
                            <i th:classappend="${menu.iconClass}"></i>
                        </span>
                        <span class="nav-link-title" th:text="${menu.menuName}">메뉴</span>
                    </a>

                    <!-- GROUP — 자식 dropdown -->
                    <th:block th:if="${menu.menuType == 'GROUP'}">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" role="button">
                            <span class="nav-link-icon" th:if="${menu.iconClass}">
                                <i th:classappend="${menu.iconClass}"></i>
                            </span>
                            <span class="nav-link-title" th:text="${menu.menuName}">그룹</span>
                        </a>
                        <div class="dropdown-menu">
                            <a th:each="child : ${menu.children}"
                               class="dropdown-item"
                               th:classappend="${child.menuUrl == currentPath} ? ' active' : ''"
                               th:href="${child.menuUrl}"
                               th:text="${child.menuName}">하위</a>
                        </div>
                    </th:block>
                </li>

                <!-- 빈 사이드바 안내 -->
                <li class="nav-item" th:if="${#lists.isEmpty(sidebarMenus)}">
                    <span class="nav-link text-secondary">권한 보유 메뉴 없음</span>
                </li>

            </ul>
        </div>
    </div>
</aside>
</body>
</html>
