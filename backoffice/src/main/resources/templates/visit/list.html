<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('방문 이력')}"></head>
<body>
<div class="page">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-wrapper">
        <header th:replace="~{fragments/topnav :: topnav}"></header>

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <div class="page-pretitle">기사/방문</div>
                        <h2 class="page-title">방문 이력</h2>
                        <p class="text-secondary mt-1">기사별 같은 날 일정 5건 초과 시 배정 차단. 예정일은 오늘 이후만.</p>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list">
                            <button type="button" class="btn btn-primary" onclick="VisitForm.openCreate()">
                                <i class="ti ti-plus"></i> 방문 배정
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">

                <div class="card mb-3">
                    <div class="card-body">
                        <form id="searchForm" class="row g-2 search-form" onsubmit="return VisitList.search(event)">
                            <div class="col-md-3">
                                <label class="form-label">기사</label>
                                <select name="engineerId" id="searchEngineerId" class="form-select">
                                    <option value="">전체</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">방문 유형</label>
                                <select name="visitType" id="searchVisitType" class="form-select">
                                    <option value="">전체</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">상태</label>
                                <select name="visitStatus" class="form-select">
                                    <option value="">전체</option>
                                    <option value="SCHEDULED" selected>예정</option>
                                    <option value="COMPLETED">완료</option>
                                    <option value="CANCELLED">취소</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">예정일 (시작 ~ 종료)</label>
                                <div class="row g-1">
                                    <div class="col-6"><input type="date" name="dateFrom" class="form-control"></div>
                                    <div class="col-6"><input type="date" name="dateTo" class="form-control"></div>
                                </div>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="ti ti-search me-1"></i> 조회
                                </button>
                                <button type="button" class="btn btn-default" onclick="VisitList.reset()">
                                    <i class="ti ti-refresh me-1"></i> 초기화
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card card-grid">
                    <div class="card-body">
                        <div id="visitGrid" class="ag-theme-quartz"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 배정/수정 모달 -->
<div class="modal modal-blur fade" id="visitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="visitModalTitle">방문 배정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="visitForm">
                    <input type="hidden" name="visitId">
                    <div class="row g-2">
                        <div class="col-md-12" id="contractRow">
                            <label class="form-label required">계약</label>
                            <select name="contractId" id="formContractId" class="form-select" required>
                                <option value="">— 선택 —</option>
                            </select>
                            <small class="form-hint">ACTIVE 상태 계약만 배정 가능</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">기사</label>
                            <select name="engineerId" id="formEngineerId" class="form-select" required>
                                <option value="">— 선택 —</option>
                            </select>
                        </div>
                        <div class="col-md-6" id="visitTypeRow">
                            <label class="form-label required">방문 유형</label>
                            <select name="visitType" id="formVisitType" class="form-select" required>
                                <option value="">— 선택 —</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">예정일</label>
                            <input type="date" name="scheduledDate" class="form-control" required>
                            <small class="form-hint">오늘 이후만</small>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">메모</label>
                            <textarea name="memo" class="form-control" rows="2" maxlength="1000"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="VisitForm.save()">저장</button>
            </div>
        </div>
    </div>
</div>

<!-- 취소 사유 모달 -->
<div class="modal modal-blur fade" id="cancelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">방문 취소 사유</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="cancelForm">
                    <input type="hidden" name="visitId">
                    <label class="form-label required">사유</label>
                    <textarea name="reason" class="form-control" rows="3" required maxlength="1000"></textarea>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" onclick="VisitForm.submitCancel()">취소 처리</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script th:src="@{/js/visit-list.js}"></script>
<script th:src="@{/js/visit-form.js}"></script>
</body>
</html>
